services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: automated_trading_meme
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d automated_trading_meme"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3001
      SIGNAL_DB_DRIVER: postgres
      SIGNAL_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/automated_trading_meme
    expose:
      - "3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      default:
      gateway:
        aliases:
          - automated-trading-meme
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/automated-trading-meme/api/signals/snapshot').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "signal:worker"]
    env_file: .env
    environment:
      NODE_ENV: production
      SIGNAL_DB_DRIVER: postgres
      SIGNAL_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/automated_trading_meme
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  gateway:
    external: true
    name: snk-mark-six_default
